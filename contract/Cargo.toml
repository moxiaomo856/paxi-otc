[package]
name = "paxi-otc"
version = "0.3.0"
edition = "2021"
description = "Paxi Network OTC contract with admin & fee splitting"
license = "MIT"
# 免责声明：本合约仅供试验、调试、技术研究用途，不得用于实际交易或商业用途。
# 部署即视为同意 README.md 中的免责声明全部条款。

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "1.5"
cw-storage-plus = "1.2"
cw2 = "1.1"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
thiserror = "1"

[dev-dependencies]
cosmwasm-std = "1.5"
