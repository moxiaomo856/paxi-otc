<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Paxi OTC - 场外交易市场</title>
  <meta name="description" content="Paxi Network OTC 场外交易平台 - 去中心化挂单交易">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236366f1'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white'>OTC</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; line-height: 1.6;
      overscroll-behavior-y: none;
    }

    /* Header */
    .header {
      background: var(--bg-card); border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      flex-wrap: wrap; gap: 6px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 32px; height: 32px; background: var(--primary); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 11px; color: white; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .header-badge {
      font-size: 10px; background: var(--primary); color: white;
      padding: 1px 7px; border-radius: 100px; font-weight: 600; flex-shrink: 0;
    }
    .header-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
    .header-right .wallet-balance { font-size: 11px; font-weight: 600; color: var(--success); white-space: nowrap; }
    .header-right .wallet-address {
      font-size: 10px; color: var(--text-muted); background: var(--bg);
      padding: 3px 6px; border-radius: 4px; font-family: monospace;
      max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .header-right select {
      font-size: 10px; padding: 3px 6px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px; color: var(--text); cursor: pointer;
    }
    .btn-sm {
      padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer;
      font-size: 11px; font-weight: 600; transition: all 0.15s; min-height: 28px; white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:active { background: var(--bg-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: var(--warning); color: white; }

    /* Main */
    .main {
      max-width: 600px; margin: 0 auto;
      padding: 12px 16px; padding-bottom: calc(16px + var(--safe-bottom));
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 12px;
      background: var(--bg-card); border-radius: 10px; padding: 4px;
    }
    .tab {
      flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      color: var(--text-muted); transition: all 0.15s;
    }
    .tab.active { color: var(--text); background: var(--bg-hover); }

    /* Card */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }

    /* Order Card */
    .order-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
      border-left: 4px solid var(--primary); transition: all 0.15s;
    }
    .order-card.completed { border-left-color: var(--success); opacity: 0.7; }
    .order-card.cancelled, .order-card.refunded { border-left-color: var(--text-muted); opacity: 0.5; }
    .order-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .order-id { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    .order-status {
      font-size: 10px; padding: 2px 8px; border-radius: 100px; font-weight: 600;
    }
    .order-status.active { background: rgba(99,102,241,0.2); color: var(--primary); }
    .order-status.completed { background: rgba(34,197,94,0.2); color: var(--success); }
    .order-status.cancelled { background: rgba(239,68,68,0.15); color: var(--danger); }
    .order-status.refunded { background: rgba(245,158,11,0.15); color: var(--warning); }

    .order-body { display: flex; gap: 12px; align-items: stretch; margin-bottom: 10px; }
    .order-side { flex: 1; }
    .order-side-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
    .order-side-value { font-size: 16px; font-weight: 700; }
    .order-side-denom { font-size: 12px; color: var(--text-muted); }
    .order-arrow { display: flex; align-items: center; color: var(--text-muted); font-size: 18px; }

    .order-meta {
      display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px;
      color: var(--text-muted); margin-bottom: 10px;
    }
    .order-meta-item { display: flex; align-items: center; gap: 4px; }
    .order-seller { font-family: monospace; font-size: 10px; }
    .order-price {
      background: var(--bg); border-radius: 8px; padding: 8px 12px;
      font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
    }
    .order-price strong { color: var(--primary); }
    .order-actions { display: flex; gap: 8px; }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 14px; font-family: monospace; transition: border-color 0.15s; -webkit-appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    select { cursor: pointer; font-family: sans-serif; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 400px) { .form-row { grid-template-columns: 1fr; } }
    .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Button */
    .btn {
      padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status */
    .status-msg {
      padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
      margin-top: 12px; display: none; word-break: break-word;
    }
    .status-msg.success { background: rgba(34,197,94,0.15); color: var(--success); display: block; }
    .status-msg.error { background: rgba(239,68,68,0.15); color: var(--danger); display: block; }
    .status-msg.info { background: rgba(99,102,241,0.15); color: var(--primary); display: block; }
    .status-msg.warning { background: rgba(245,158,11,0.15); color: var(--warning); display: block; }

    /* Info box */
    .info-box {
      background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
      border-radius: 8px; padding: 10px 14px; font-size: 12px; margin-bottom: 12px; line-height: 1.6;
    }
    .info-box strong { color: var(--primary); }
    .warning-box {
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);
      border-radius: 8px; padding: 10px 14px; font-size: 12px; margin-bottom: 12px; line-height: 1.6;
    }

    /* Spinner */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
      z-index: 200; animation: slideUp 0.3s ease; box-shadow: var(--shadow);
      max-width: 90vw; text-align: center;
    }
    @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* Empty state */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 8px; }
    .empty-state .text { font-size: 14px; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-card { background: var(--bg); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-value { font-size: 18px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--primary); }
    a { color: var(--primary); text-decoration: none; }
    a:active { color: var(--primary-hover); }

    /* Desktop */
    @media (min-width: 768px) { .main { padding: 20px 16px; } .header-title { font-size: 17px; } }

    /* Mobile: bottom nav bar */
    .bottom-nav { display: none; }
    @media (max-width: 767px) {
      .header-left { width: 100%; justify-content: center; }
      .header-right { width: 100%; justify-content: center; }
      .tabs { display: none !important; }
      .main { padding-bottom: calc(64px + var(--safe-bottom)); }

      .bottom-nav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--bg-card); border-top: 1px solid var(--border);
        padding: 6px 4px; padding-bottom: calc(6px + var(--safe-bottom));
        z-index: 100; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      }
      .bottom-nav-item {
        flex: 1; text-align: center; padding: 6px 2px; cursor: pointer;
        font-size: 10px; font-weight: 600; color: var(--text-muted);
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        transition: color 0.15s; min-height: 44px; justify-content: center;
      }
      .bottom-nav-item.active { color: var(--primary); }
      .bottom-nav-item .nav-icon { font-size: 18px; }
    }

    /* Language toggle button */
    .btn-lang {
      padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 11px; font-weight: 700;
      cursor: pointer; min-height: 28px; transition: all 0.15s;
    }
    .btn-lang:active { background: var(--bg-hover); border-color: var(--primary); }

    /* Mobile: larger touch targets */
    @media (max-width: 767px) {
      .header-right select { font-size: 11px; padding: 4px 8px; }
      .order-card { padding: 12px 14px; }
      .order-side-value { font-size: 15px; }
      .stat-value { font-size: 16px; }
      .card { padding: 14px; }
      .form-group { margin-bottom: 12px; }
      input[type="text"], input[type="number"], select { padding: 12px 14px; font-size: 15px; }
      .btn { min-height: 48px; font-size: 15px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">OTC</div>
    <div class="header-title">Paxi OTC</div>
    <span class="header-badge" id="headerBadge">场外交易</span>
  </div>
  <div class="header-right">
    <span class="wallet-balance" id="walletBalance" style="display:none"></span>
    <span class="wallet-address" id="walletAddress" style="display:none"></span>
    <span id="networkSelector"></span>
    <button class="btn-lang" id="btnLang" onclick="toggleLang()">中/EN</button>
    <button class="btn btn-primary btn-sm" id="btnConnect" onclick="connectWallet()">连接钱包</button>
    <button class="btn btn-outline btn-sm" id="btnDisconnect" style="display:none" onclick="disconnectWallet()">断开</button>
  </div>
</header>

<main class="main" id="mainContent"></main>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js"></script>
<script src="i18n.js"></script>
<script src="shared.js"></script>
<script src="compat.js"></script>
<script src="app.js"></script>
<script>
  renderNetworkSelector('networkSelector');
  updateLangButton();
  // Update header static text on load
  document.getElementById('headerBadge').textContent = t('appBadge');
  document.getElementById('btnConnect').textContent = t('connectWallet');
  document.getElementById('btnDisconnect').textContent = t('disconnect');
</script>
</body>
</html>
