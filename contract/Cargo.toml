[package]
name = "paxi-otc"
version = "0.2.0"
edition = "2021"
description = "Paxi Network OTC contract with admin & fee splitting"

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmwasm-std = { version = "1.5", features = ["staking"] }
cw-storage-plus = "1.2"
cw2 = "1.1"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
thiserror = "1"
